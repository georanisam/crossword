<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>혜란샘의 가로세로 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --paper:#f4f1ea; --card:#fffdf8; --ink:#23201b; --ink-soft:#6b655c;
  --accent:#cc5b3f; --accent-dark:#a8472f; --line:#e2dccf; --line-dk:#c9c0ad;
  --teal:#2a6f6b; --good:#2f8f57; --good-bg:#e3f3e8; --bad:#c0392b; --bad-bg:#fbe6e2;
  --sel:#ffe2a8; --inword:#fff6e6; --shadow:0 8px 28px rgba(40,30,15,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:'Pretendard',sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.6;
  background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px;}
header{background:var(--ink);color:#f4f1ea;padding:0 20px;display:flex;align-items:center;gap:12px;height:58px;position:sticky;top:0;z-index:40;box-shadow:0 2px 14px rgba(0,0,0,.18);}
.logo{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:20px;display:flex;align-items:center;gap:9px;}
.logo .badge{background:var(--teal);color:#fff;font-family:'Pretendard';font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;}
#timer{margin-left:auto;font-weight:800;font-size:15px;background:rgba(255,255,255,.1);padding:5px 12px;border-radius:9px;letter-spacing:.5px;display:none;}
main{max-width:860px;margin:0 auto;padding:22px 16px 90px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow);margin-bottom:18px;}
.center{text-align:center;}
h1.qtitle{font-family:'Nanum Myeongjo',serif;font-size:24px;margin:0 0 6px;line-height:1.25;}
.sub{color:var(--ink-soft);font-size:14px;margin:0 0 20px;}
.field{display:flex;flex-direction:column;gap:6px;text-align:left;margin-bottom:14px;}
.field label{font-size:12.5px;font-weight:700;color:var(--ink-soft);}
.field input{border:1.5px solid var(--line-dk);border-radius:11px;padding:13px 14px;font-size:16px;background:#fff;}
.field input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(42,111,107,.13);}
.btn{border:none;border-radius:12px;padding:14px 22px;font-size:16px;font-weight:800;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;}
.btn:active{transform:translateY(1px);}
.btn-teal{background:var(--teal);color:#fff;}
.btn-accent{background:var(--accent);color:#fff;}
.btn-ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line-dk);}
.btn-row{display:flex;gap:10px;}
.btn-row .btn{width:auto;flex:1;}
#clueBar{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:14px;font-size:15px;display:flex;align-items:center;gap:10px;min-height:50px;position:sticky;top:58px;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.05);}
#clueBar .cb{font-weight:800;color:#fff;border-radius:7px;padding:3px 9px;font-size:13px;white-space:nowrap;}
#clueBar.across .cb{background:var(--accent);}
#clueBar.down .cb{background:var(--teal);}
#clueBar .txt{flex:1;}
#clueBar .nav{background:#f1ece0;border:none;width:34px;height:34px;border-radius:9px;font-size:16px;color:var(--ink);flex:none;}
#gridWrap{position:relative;display:flex;justify-content:center;overflow-x:auto;padding:4px;margin-bottom:18px;}
#grid{display:grid;gap:0;border:4px solid #1f1c17;background:#1f1c17;position:relative;}
.cell{position:relative;background:#fff;border:1px solid #c9c4b8;-webkit-user-select:none;user-select:none;}
.cell.blank{background:#f1f1f1;background-image:repeating-linear-gradient(45deg,#f1f1f1,#f1f1f1 3px,#e4e4e4 3px,#e4e4e4 6px);border:1px solid #ddd;}
.cell .lbl{position:absolute;top:1px;left:2px;font-size:9px;line-height:1;font-weight:700;pointer-events:none;z-index:3;white-space:nowrap;}
.cell .lbl .a{color:var(--accent);}
.cell .lbl .d{color:var(--teal);}
.cell .txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-top:6px;font-weight:700;color:var(--ink);z-index:1;}
.cell.in-word{background:var(--inword);}
.cell.sel{background:var(--sel);}
.cell.correct{background:var(--good-bg)!important;}
.cell.correct .txt{color:var(--good);}
.cell.wrong{background:var(--bad-bg)!important;}
.cell.wrong .txt{color:var(--bad);}
.cell .ans{position:absolute;bottom:0px;right:2px;font-size:10px;font-weight:800;color:var(--good);line-height:1;pointer-events:none;z-index:3;}
#hin{position:absolute;left:0;top:0;width:1px;height:1px;border:none;background:transparent;color:transparent;caret-color:transparent;text-align:center;font-family:inherit;font-size:16px;outline:none;padding:0;margin:0;z-index:2;}
.clues{display:flex;gap:24px;flex-wrap:wrap;}
.cluecol{flex:1;min-width:240px;}
.cluecol h3{font-size:15px;margin:0 0 8px;padding-bottom:5px;border-bottom:2px solid;}
.cluecol.a h3{color:var(--accent);border-color:var(--accent);}
.cluecol.d h3{color:var(--teal);border-color:var(--teal);}
.clue-item{padding:7px 9px;border-radius:8px;cursor:pointer;font-size:14px;line-height:1.45;}
.clue-item:hover{background:#f6f1e6;}
.clue-item.on{background:var(--inword);}
.clue-item b{margin-right:4px;}
.clue-item.a b{color:var(--accent);}
.clue-item.d b{color:var(--teal);}
#result{display:none;border-radius:16px;padding:22px;margin-bottom:18px;text-align:center;color:#fff;}
#result .score{font-size:44px;font-weight:800;line-height:1;margin:6px 0;}
#result .detail{font-size:15px;opacity:.95;}
#result .big{font-size:17px;font-weight:800;margin-bottom:2px;}
.loading{position:fixed;inset:0;background:rgba(244,241,234,.85);display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:200;}
.loading.show{display:flex;}
.spinner{width:46px;height:46px;border:5px solid var(--line-dk);border-top-color:var(--teal);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading p{font-weight:700;color:var(--ink-soft);}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:13px 22px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.3s;z-index:300;box-shadow:0 8px 24px rgba(0,0,0,.25);}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
.empty{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.empty .big{font-size:34px;margin-bottom:8px;}
.hide{display:none!important;}
.submitbar{position:fixed;bottom:0;left:0;right:0;background:rgba(255,253,248,.96);border-top:1px solid var(--line);padding:12px 16px;backdrop-filter:blur(6px);z-index:30;display:none;}
.submitbar .inner{max-width:860px;margin:0 auto;}
</style>
</head>
<body>
<header>
  <div class="logo">혜란샘의 가로세로 퀴즈<span class="badge">풀기</span></div>
  <div id="timer">00:00</div>
</header>

<main>
  <section id="startView">
    <div class="card center"><div id="startBody"><div class="empty">퀴즈를 불러오는 중…</div></div></div>
  </section>

  <section id="playView" class="hide">
    <div id="result"></div>
    <div id="clueBar"><span class="txt" style="color:var(--ink-soft);">칸이나 단서를 눌러 시작하세요</span></div>
    <div id="gridWrap"><div id="grid"></div></div>
    <div class="card">
      <div class="clues">
        <div class="cluecol a"><h3>가로 열쇠</h3><div id="acrossList"></div></div>
        <div class="cluecol d"><h3>세로 열쇠</h3><div id="downList"></div></div>
      </div>
    </div>
  </section>
</main>

<div class="submitbar" id="submitbar"><div class="inner">
  <div id="submitArea"><button class="btn btn-accent" onclick="submitQuiz()">제출하고 채점 받기</button></div>
</div></div>

<div class="loading" id="loading"><div class="spinner"></div><p id="loadMsg">처리 중…</p></div>
<div id="toast"></div>

<script>
/* ===== 설정 ===== */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyWFSkILmqttqMDeM0xr6XisuoRfzLgCc0Z2h5ujN4ZpPY5N1ES0HVCvVxX-qp3oSSN/exec';
const KO_LABELS = ['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

/* ===== 상태 ===== */
const state = { quiz:null, model:null, cellEls:{}, letters:{}, hin:null,
                sel:null, dir:'across', run:null,
                studentName:'', studentId:'', startTime:0, timerId:null, graded:false };

/* ===== 유틸 ===== */
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function nfc(s){return String(s||'').normalize('NFC');}
function showLoading(m){ $('loadMsg').textContent=m||'처리 중…'; $('loading').classList.add('show'); }
function hideLoading(){ $('loading').classList.remove('show'); }
let toastTimer;
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2600); }
/* 한 반이 동시에 접속하면 요청 몇 개는 반드시 늦거나 실패한다.
   그걸 학생 화면에 그대로 띄우지 말고, 조용히 몇 번 더 시도한다.
   - 25초 안에 응답이 없으면 끊고 다시 시도 (안 끊으면 Safari가 '무한 로딩'처럼 보인다)
   - 재시도 간격에 난수를 섞어 30명이 동시에 재시도하지 않게 한다 */
const API_TIMEOUT = 25000;
const API_TRIES   = 3;

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function apiOnce(payload){
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), API_TIMEOUT);
  try{
    const res = await fetch(GAS_URL,{method:'POST',body:JSON.stringify(payload),signal:ctrl.signal});
    const text = await res.text();
    let data;
    try{ data = JSON.parse(text); }
    catch(e){ const err=new Error('서버가 잠시 응답하지 못했어요.'); err.retryable=true; throw err; }
    if(!data.ok){ const err=new Error(data.error||'알 수 없는 오류'); err.retryable=false; throw err; }
    return data;
  }catch(e){
    if(e.name==='AbortError'){ const err=new Error('서버 응답이 너무 느려요.'); err.retryable=true; throw err; }
    if(e.retryable===undefined) e.retryable = true;   // 네트워크 오류(Load failed 등)
    throw e;
  }finally{ clearTimeout(t); }
}

async function api(payload){
  let last;
  for(let i=0;i<API_TRIES;i++){
    try{ return await apiOnce(payload); }
    catch(e){
      last = e;
      if(!e.retryable) throw e;                       // 서버가 이유를 알려준 오류는 재시도 안 함
      if(i < API_TRIES-1) await sleep(800*(i+1) + Math.random()*900);
    }
  }
  throw last;
}
function getQuizId(){ const m=location.search.match(/[?&]quiz=([^&]+)/); return m?decodeURIComponent(m[1]):''; }

/* ===== 로드 =====
   예전에는 퀴즈를 다 받은 뒤에야 학번/이름 화면을 그렸다.
   그래서 서버가 느리면 학생 눈에는 아무것도 안 뜨고 멈춘 것처럼 보였다.
   이제는 학번/이름 화면을 먼저 띄우고, 학생이 입력하는 동안 뒤에서 퀴즈를 받는다. */
let quizPromise = null;

window.addEventListener('load', boot);
function boot(){
  const quizId=getQuizId();
  if(!quizId){ $('startBody').innerHTML='<div class="empty"><div class="big">🔗</div>잘못된 접속이에요.<br>선생님이 주신 링크로 다시 들어와 주세요.</div>'; return; }
  renderStart();                 // 화면 먼저
  quizPromise = fetchQuiz(quizId);  // 퀴즈는 뒤에서
  quizPromise.then(()=>{ setStartStatus(''); applyQuizName(); })
             .catch(err=>setStartStatus('⚠️ '+err.message+' — [시작하기]를 누르면 다시 시도해요.'));
}

// 퀴즈 제목은 도착한 뒤에 채운다 (그 전에는 '가로세로 퀴즈'로 보인다)
function applyQuizName(){
  const h=$('startTitle');
  if(h && state.quiz) h.textContent=state.quiz.quizName||'가로세로 퀴즈';
}

async function fetchQuiz(quizId){
  // 새로고침했을 때 서버를 다시 부르지 않도록 이 탭에만 잠깐 저장해 둔다 (정답은 들어있지 않음)
  const ck='quiz_'+quizId;
  try{ const c=sessionStorage.getItem(ck); if(c){ state.quiz=JSON.parse(c); return state.quiz; } }catch(e){}

  // 30명이 같은 순간에 링크를 열면 요청이 한꺼번에 몰린다. 조금씩 흩어서 보낸다.
  await sleep(Math.random()*900);

  const data=await api({action:'getQuizForPlay',quizId});
  state.quiz=data.quiz;
  try{ sessionStorage.setItem(ck, JSON.stringify(state.quiz)); }catch(e){}
  return state.quiz;
}

function setStartStatus(msg){
  const el=$('startStatus'); if(!el) return;
  el.textContent=msg; el.style.display=msg?'block':'none';
}

function renderStart(){
  $('startBody').innerHTML=`
    <h1 class="qtitle" id="startTitle">${esc((state.quiz&&state.quiz.quizName)||'가로세로 퀴즈')}</h1>
    <p class="sub">학번과 이름을 입력하고 시작하세요 ✏️</p>
    <div class="field"><label>학번</label><input type="text" id="inId" inputmode="numeric" placeholder="예: 10523" autocomplete="off"></div>
    <div class="field"><label>이름</label><input type="text" id="inName" placeholder="예: 홍길동" autocomplete="off"></div>
    <button class="btn btn-teal" id="startBtn" onclick="startPlay()">시작하기 →</button>
    <p class="sub" id="startStatus" style="display:none;margin-top:12px;font-size:13px;"></p>`;
  $('inId').addEventListener('keydown',e=>{ if(e.key==='Enter') $('inName').focus(); });
  $('inName').addEventListener('keydown',e=>{ if(e.key==='Enter') startPlay(); });
}

/* ===== 모델 ===== */
function buildModel(quiz){
  const {rows,cols}=quiz.gridSize;
  const words=quiz.words.map((w,i)=>({direction:w.direction,row:w.row,col:w.col,len:w.length,clue:w.clue,id:i}));
  const byPos=(a,b)=>a.row-b.row||a.col-b.col;
  const across=words.filter(w=>w.direction==='across').slice().sort(byPos);
  const down=words.filter(w=>w.direction==='down').slice().sort(byPos);
  across.forEach((w,i)=>w.label=String(i+1));
  down.forEach((w,i)=>w.label=i<KO_LABELS.length?KO_LABELS[i]:('A'+(i+1)));
  const cell={};
  words.forEach(w=>{ for(let i=0;i<w.len;i++){ const r=w.direction==='down'?w.row+i:w.row, c=w.direction==='across'?w.col+i:w.col; const k=r+'-'+c;
    if(!cell[k]) cell[k]={across:null,down:null,aLabel:'',dLabel:''};
    if(w.direction==='across') cell[k].across=w.id; else cell[k].down=w.id; } });
  words.forEach(w=>{ const k=w.row+'-'+w.col; if(w.direction==='across') cell[k].aLabel=w.label; else cell[k].dLabel=w.label; });
  return {rows,cols,words,cell,across,down};
}
function cellsOf(w){ const a=[]; for(let i=0;i<w.len;i++){ const r=w.direction==='down'?w.row+i:w.row, c=w.direction==='across'?w.col+i:w.col; a.push({r,c}); } return a; }
function currentWord(){ if(!state.sel) return null; const info=state.model.cell[state.sel.r+'-'+state.sel.c]; if(!info)return null; const id=info[state.dir]; if(id==null)return null; return state.model.words[id]; }

/* ===== 시작 ===== */
async function startPlay(){
  const id=$('inId').value.trim(), name=$('inName').value.trim();
  if(!id){ toast('학번을 입력하세요.'); $('inId').focus(); return; }
  if(!name){ toast('이름을 입력하세요.'); $('inName').focus(); return; }

  // 대개는 입력하는 동안 이미 도착해 있다. 아직이면(또는 실패했으면) 여기서 기다리거나 다시 시도한다.
  if(!state.quiz){
    const btn=$('startBtn'); if(btn){ btn.disabled=true; btn.textContent='퀴즈를 불러오는 중…'; }
    setStartStatus('');
    try{
      if(!quizPromise) quizPromise = fetchQuiz(getQuizId());
      await quizPromise;
    }catch(err){
      quizPromise = null;   // 다음에 다시 누르면 새로 시도
      setStartStatus('⚠️ '+err.message+' — 잠시 후 [시작하기]를 다시 눌러주세요.');
      if(btn){ btn.disabled=false; btn.textContent='시작하기 →'; }
      return;
    }
    if(btn){ btn.disabled=false; btn.textContent='시작하기 →'; }
  }

  state.studentId=id; state.studentName=name; state.model=buildModel(state.quiz);
  $('startView').classList.add('hide'); $('playView').classList.remove('hide');
  $('submitbar').style.display='block'; $('timer').style.display='block';
  createHiddenInput(); renderGrid(); renderClues(); startTimer();
}

/* ===== 타이머 ===== */
function startTimer(){ state.startTime=Date.now(); state.timerId=setInterval(()=>{ $('timer').textContent=fmt(Math.floor((Date.now()-state.startTime)/1000)); },1000); }
function stopTimer(){ if(state.timerId){ clearInterval(state.timerId); state.timerId=null; } }
function fmt(sec){ const m=Math.floor(sec/60), s=sec%60; return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
/* 시트로 보낼 때는 "03:25" 대신 "3분 25초" — 구글 시트가 "03:25"를 시각(3시 25분)으로
   바꿔 저장해 버려서 선생님 화면에 1899년 날짜가 뜨던 문제 때문이다. 형식을 되돌리지 말 것. */
function fmtHuman(sec){ const m=Math.floor(sec/60), s=sec%60; return m ? m+'분 '+String(s).padStart(2,'0')+'초' : s+'초'; }

/* ===== 숨은 입력창 (모든 한글 조합이 여기서 일어남) ===== */
function createHiddenInput(){
  const hin=document.createElement('input');
  hin.id='hin'; hin.type='text';
  hin.setAttribute('autocomplete','off'); hin.setAttribute('autocapitalize','off');
  hin.setAttribute('autocorrect','off'); hin.setAttribute('spellcheck','false');
  hin.addEventListener('input', onInput);
  hin.addEventListener('compositionend', onInput);
  hin.addEventListener('keydown', onKey);
  /* 선택된 칸은 입력창이 덮고 있으므로, 그 위 탭은 여기서 받아 가로/세로를 전환한다 */
  hin.addEventListener('click', ()=>{ if(state.sel) onClickCell(state.sel.r,state.sel.c); });
  $('gridWrap').appendChild(hin);
  state.hin=hin;
}

/* 입력창을 선택된 칸 위로 겹친다 — DOM에서 옮기지 않고 좌표만 바꾼다 */
function positionHin(){
  const hin=state.hin; if(!hin) return;
  const el=state.sel&&state.cellEls[state.sel.r+'-'+state.sel.c];
  if(!el){ hin.style.width='1px'; hin.style.height='1px'; return; }
  const g=$('grid'), d=el.div;
  hin.style.left=(g.offsetLeft+g.clientLeft+d.offsetLeft)+'px';
  hin.style.top =(g.offsetTop +g.clientTop +d.offsetTop )+'px';
  hin.style.width =d.offsetWidth +'px';
  hin.style.height=d.offsetHeight+'px';
}

/* ===== 그리드 ===== */
function cellSize(){
  const N=state.model.cols;
  const vw=window.innerWidth;
  const maxContainer=Math.min(vw-40, 720);        // PC/태블릿에선 더 넓게
  const maxCell=vw>=700 ? 74 : 46;                 // 큰 화면일수록 칸도 크게
  let cell=Math.floor(maxContainer/N);
  return Math.max(28, Math.min(maxCell, cell));    // 5×5·7×7 등 작은 판도 크게
}
function renderGrid(){
  const M=state.model, cs=cellSize();
  const grid=$('grid'); grid.style.gridTemplateColumns=`repeat(${M.cols}, ${cs}px)`;
  grid.innerHTML=''; state.cellEls={};
  const fontPx=Math.round(cs*0.5);
  for(let r=0;r<M.rows;r++) for(let c=0;c<M.cols;c++){
    const k=r+'-'+c, info=M.cell[k];
    const div=document.createElement('div');
    div.style.width=cs+'px'; div.style.height=cs+'px';
    if(!info){ div.className='cell blank'; grid.appendChild(div); continue; }
    div.className='cell'; div.dataset.k=k;
    let lbl=''; if(info.aLabel||info.dLabel){ const a=info.aLabel?'<span class="a">'+info.aLabel+'</span>':''; const d=info.dLabel?'<span class="d">'+info.dLabel+'</span>':''; lbl='<span class="lbl">'+a+(info.aLabel&&info.dLabel?' ':'')+d+'</span>'; }
    const txt='<span class="txt" style="font-size:'+fontPx+'px;">'+(state.letters[k]?esc(state.letters[k]):'')+'</span>';
    div.innerHTML=lbl+txt;
    div.addEventListener('click',()=>{ onClickCell(r,c); });
    state.cellEls[k]={div, txt:div.querySelector('.txt')};
    grid.appendChild(div);
  }
}
let lastGridW=window.innerWidth;
window.addEventListener('resize',()=>{
  if(!state.model) return;
  if(window.innerWidth===lastGridW){ positionHin(); return; }   /* 키보드만 올라온 경우 */
  lastGridW=window.innerWidth;
  renderGrid(); if(state.sel) selectCell(state.sel.r,state.sel.c,true);
});

/* ===== 선택 / 포커스 ===== */
function onClickCell(r,c){
  if(state.graded) return;
  const info=state.model.cell[r+'-'+c]; if(!info) return;
  if(state.sel && state.sel.r===r && state.sel.c===c && info.across!=null && info.down!=null){ state.dir = state.dir==='across'?'down':'across'; }
  selectCell(r,c);
}
function selectWord(id){ const w=state.model.words[id]; state.dir=w.direction; selectCell(w.row,w.col); }
function selectCell(r,c,noFocus){
  const info=state.model.cell[r+'-'+c]; if(!info) return;
  if(info[state.dir]==null) state.dir = info.across!=null?'across':'down';
  state.sel={r,c};
  const w=currentWord(); const cells=cellsOf(w);
  const start=cells.findIndex(p=>p.r===r&&p.c===c);
  state.run={wordId:w.id, start:start<0?0:start, len:0};
  const el=state.cellEls[r+'-'+c];
  if(el && !state.graded){ state.hin.value=''; positionHin(); if(!noFocus){ try{ state.hin.focus({preventScroll:true}); }catch(e){ state.hin.focus(); } } }
  highlight(); updateClueBar();
}

/* ===== 입력 미러링 ===== */
function setLetter(r,c,ch){ const k=r+'-'+c; state.letters[k]=ch; const el=state.cellEls[k]; if(el) el.txt.textContent=ch; }
function onInput(){
  if(state.graded || !state.run) return;
  let v=nfc(state.hin.value).replace(/\s/g,'');
  const w=state.model.words[state.run.wordId]; const cells=cellsOf(w); const start=state.run.start;
  const room=cells.length-start;
  if(v.length>room){ v=v.slice(0,room); }
  for(let i=0;i<v.length;i++){ setLetter(cells[start+i].r, cells[start+i].c, v[i]); }
  for(let i=v.length;i<state.run.len;i++){ const t=cells[start+i]; if(t) setLetter(t.r,t.c,''); }
  state.run.len=v.length;
}
function onKey(e,r,c){
  const k=e.key;
  if(k==='Backspace'){ if(state.hin.value===''){ e.preventDefault(); backCell(); } return; }
  if(k==='Enter'){ e.preventDefault(); return; }
  if(k.indexOf('Arrow')===0){
    e.preventDefault(); const s=state.sel;
    if(k==='ArrowRight'){ state.dir='across'; move(s.r,s.c,0,1); }
    else if(k==='ArrowLeft'){ state.dir='across'; move(s.r,s.c,0,-1); }
    else if(k==='ArrowDown'){ state.dir='down'; move(s.r,s.c,1,0); }
    else if(k==='ArrowUp'){ state.dir='down'; move(s.r,s.c,-1,0); }
  }
}
function backCell(){
  const w=currentWord(); if(!w)return; const cells=cellsOf(w);
  if(state.run.start>0){ const p=cells[state.run.start-1]; setLetter(p.r,p.c,''); selectCell(p.r,p.c); }
}
function move(r,c,dr,dc){
  let nr=r+dr,nc=c+dc;
  while(nr>=0&&nr<state.model.rows&&nc>=0&&nc<state.model.cols){ if(state.model.cell[nr+'-'+nc]){ selectCell(nr,nc); return; } nr+=dr; nc+=dc; }
}

/* ===== 하이라이트 / 단서바 ===== */
function highlight(){
  document.querySelectorAll('.cell').forEach(d=>d.classList.remove('sel','in-word'));
  const w=currentWord();
  if(w){ cellsOf(w).forEach(p=>{ const el=state.cellEls[p.r+'-'+p.c]; if(el)el.div.classList.add('in-word'); }); }
  if(state.sel){ const el=state.cellEls[state.sel.r+'-'+state.sel.c]; if(el)el.div.classList.add('sel'); }
  document.querySelectorAll('.clue-item').forEach(x=>x.classList.remove('on'));
  if(w){ const li=document.querySelector(`.clue-item[data-id="${w.id}"]`); if(li)li.classList.add('on'); }
}
function updateClueBar(){
  const bar=$('clueBar'); const w=currentWord();
  if(!w){ bar.className=''; bar.innerHTML='<span class="txt" style="color:var(--ink-soft);">칸이나 단서를 눌러 시작하세요</span>'; return; }
  bar.className=state.dir;
  bar.innerHTML=`<button class="nav" onclick="gotoWord(-1)">‹</button>
    <span class="cb">${state.dir==='across'?'가로':'세로'} ${w.label}</span>
    <span class="txt">${esc(w.clue)} <b style="color:var(--ink-soft);font-weight:600;">(${w.len}글자)</b></span>
    <button class="nav" onclick="gotoWord(1)">›</button>`;
}
function gotoWord(delta){
  const list=state.dir==='across'?state.model.across:state.model.down; const w=currentWord(); if(!w)return;
  let i=list.findIndex(x=>x.id===w.id); i=(i+delta+list.length)%list.length; selectWord(list[i].id);
}

/* ===== 단서 목록 ===== */
function renderClues(){
  const M=state.model;
  const mk=(w,cls)=>`<div class="clue-item ${cls}" data-id="${w.id}" onclick="selectWord(${w.id})"><b>${w.label}.</b>${esc(w.clue)} <span style="color:#b3ac9d;">(${w.len}글자)</span></div>`;
  $('acrossList').innerHTML=M.across.map(w=>mk(w,'a')).join('');
  $('downList').innerHTML=M.down.map(w=>mk(w,'d')).join('');
}

/* ===== 제출 & 채점 ===== */
async function submitQuiz(){
  const answers={}; let filled=0; let totalCells=0;
  Object.keys(state.model.cell).forEach(k=>{ totalCells++; const v=nfc(state.letters[k]||'').trim(); answers[k]=v; if(v)filled++; });
  if(filled===0){ toast('아직 아무 칸도 채우지 않았어요.'); return; }
  const empty=totalCells-filled;
  if(empty>0 && !confirm(`빈 칸이 ${empty}개 있어요. 그대로 제출할까요?`)) return;
  const sec=Math.floor((Date.now()-state.startTime)/1000);
  showLoading('채점하는 중…');
  // 이 버튼 한 번에 하나씩 붙는 값. 네트워크가 끊겨 자동 재시도가 일어나도
  // 서버가 같은 attemptId를 알아보고 기록을 두 번 남기지 않는다.
  const attemptId='A'+Date.now()+'-'+Math.random().toString(36).slice(2,8);
  try{
    const data=await api({action:'submitAnswer',attemptId,quizId:state.quiz.quizId,studentName:state.studentName,studentId:state.studentId,answers,timeSpent:fmtHuman(sec)});
    stopTimer(); showResult(data);
  }catch(err){ alert('제출 오류: '+err.message+'\n\n잠시 후 [제출하기]를 한 번만 더 눌러주세요.'); }
  finally{ hideLoading(); }
}
function showResult(data){
  state.graded=true;
  if(state.hin){ state.hin.blur(); state.hin.style.width='1px'; state.hin.style.height='1px'; }   /* DOM에서 빼면 '다시 풀기' 때 입력이 죽는다 */
  document.querySelectorAll('.cell').forEach(d=>d.classList.remove('sel','in-word'));
  Object.keys(state.model.cell).forEach(k=>{
    const el=state.cellEls[k]; if(!el)return; const div=el.div;
    div.classList.remove('correct','wrong'); const old=div.querySelector('.ans'); if(old)old.remove();
    if(data.result[k]){ div.classList.add('correct'); }
    else{ div.classList.add('wrong'); const s=document.createElement('span'); s.className='ans'; s.textContent=data.correctMap[k]||''; div.appendChild(s); }
  });
  const sc=data.score;
  const color=sc>=80?'var(--good)':sc>=50?'#c98a1e':'var(--bad)';
  const msg=sc>=80?'아주 잘했어요! 🎉':sc>=50?'좋아요! 조금만 더 💪':'다시 도전해봐요! 🙂';
  const R=$('result'); R.style.background=color;
  R.innerHTML=`<div class="big">${esc(state.studentName)} 님의 결과</div>
    <div class="score">${sc}점</div>
    <div class="detail">맞은 칸 ${data.correct} / ${data.total}개 · 소요시간 ${fmtHuman(Math.floor((Date.now()-state.startTime)/1000))}</div>
    <div class="detail" style="margin-top:6px;font-weight:700;">${msg}</div>`;
  R.style.display='block';
  $('submitArea').innerHTML=`<div class="btn-row">
      <button class="btn btn-ghost" onclick="retry()">수정해서 다시 풀기</button>
      <button class="btn btn-accent" onclick="reSubmit()">다시 제출</button></div>`;
  window.scrollTo({top:0,behavior:'smooth'});
  toast('채점 완료! 결과가 선생님께 저장되었어요.');
}
function retry(){
  state.graded=false;
  document.querySelectorAll('.cell').forEach(d=>{ d.classList.remove('correct','wrong'); const a=d.querySelector('.ans'); if(a)a.remove(); });
  $('result').style.display='none';
  $('submitArea').innerHTML=`<button class="btn btn-accent" onclick="submitQuiz()">제출하고 채점 받기</button>`;
  if(!state.timerId) startTimer();
  $('gridWrap').scrollIntoView({behavior:'smooth',block:'center'});
  toast('칸을 눌러 수정한 뒤 다시 제출하세요.');
}
function reSubmit(){ retry(); setTimeout(submitQuiz,200); }
</script>
